WindowCaptureNote="This captures the window's area of the screen: Renga has no compositor yet, so windows on top of it are captured too (see \"When the window is covered\"). It follows the window when it moves or is resized, and pauses, keeping the last picture, while it's minimized, hidden or on another workspace."
WhenCovered="When the window is covered"
WhenCovered.Capture="Capture anyway (covering windows are in the picture)"
WhenCovered.PauseFully="Pause while it is fully covered"
WhenCovered.PauseAny="Pause while any part of it is covered"
