WindowCaptureNote="Haiku doesn't let other applications read a window's own image, so this captures the window's area of the screen. It follows the window when it moves or is resized, and pauses while it's minimized or on another workspace. Windows on top of it are captured too."
CaptureMethod="Capture method"
CaptureMethod.TearFree="Tear-free (pointer may stutter while capturing)"
CaptureMethod.SmoothPointer="Smooth pointer (fast motion may show a seam)"
CaptureMethod.Description="Haiku's screen can only be copied while the display server is paused, which also pauses the mouse pointer. Tear-free copies each frame in one piece. Smooth pointer copies it in short strips so the pointer keeps moving, but something moving during the copy can show a horizontal seam in that frame."
