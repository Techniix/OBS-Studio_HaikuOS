StartCapture="Start capture"
Status.WaitingForPermission="Waiting for your permission: answer the \"Screen recording\" prompt. OBS keeps working meanwhile; the capture starts as soon as you allow it."
Status.Denied="OBS isn't allowed to record the screen. To allow it, open the Screen recording preferences (ScreenRecording) and set OBS to \"Allowed\", or press \"Try again\" to be asked again."
Status.NotAnswered="The \"Screen recording\" prompt was closed without an answer. Press \"Try again\" to be asked again."
Status.StoppedByUser="The capture was stopped from the Screen recording indicator or preferences. Press \"Start capture\" to capture again: this restarts every Screen and Window Capture source that was stopped this way."
Status.Failed="The capture could not be started (see the log). Trying again every second."
Status.RegionOffScreen="The region is outside the screen."
Status.WindowNotOpen="The selected window isn't open or is outside the screen (or no window is selected). Capture starts when it appears."
